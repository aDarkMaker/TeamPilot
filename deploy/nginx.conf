server {
    listen 80;
    server_name huaxiaoke.work www.huaxiaoke.work;

    root /usr/share/nginx/html;
    index index.html;

    # Firefox HTTPS-First is stricter about accidental http:// same-origin
    # fetches (e.g. ClientRouter prefetch). Force upgrade instead of blocking.
    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    # pdf.js worker is shipped as .mjs; stock alpine mime.types map it to
    # application/octet-stream and browsers refuse to load it as a module.
    location ~* \.mjs$ {
        try_files $uri =404;
        default_type text/javascript;
        types { }
        add_header Content-Type text/javascript always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;
    }

    location = / {
        return 302 /auth;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 200m;

    location /joinus-files/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
