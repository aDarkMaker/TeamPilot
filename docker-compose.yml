version: "3.9"

# One release stack (blue or green). The host nginx switches traffic between the
# two stacks through the `hxktoolbox_app` upstream defined in upstream.conf.
services:
  backend:
    image: hxktoolbox-backend:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
    volumes:
      - ./data:/app/data
    expose:
      - "3000"
    networks:
      - app
      - shared
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    image: hxktoolbox-nginx:${RELEASE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://huaxiaoke.work}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    networks:
      app:
      shared:
        aliases:
          - ${SERVICE_ROLE:-blue}

networks:
  app:
  shared:
    external: true
    name: ${SHARED_NETWORK_NAME:-hxktoolbox_shared}
